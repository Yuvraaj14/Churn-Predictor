version: '3.8'

services:
  api:
    build: .
    container_name: churn-predictor-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - REDIS_TTL=3600
      - CHAMPION_MODEL=xgboost
      - CHALLENGER_MODEL=lightgbm
      - AB_TEST_RATIO=0.2
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: churn-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  redis_data: